name: Quality

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py core demo_execution engines filters shadow_runtime strategies strategy trading_v2 utils webapp
      - name: Run offline test suite
        env:
          USE_TESTNET: "true"
          DEMO_EXECUTION_ENABLED: "false"
          TELEGRAM_PROPOSAL_DEMO_MODE: "false"
          DATA_DIR: ${{ runner.temp }}/tradingbot5
        run: python -m pytest -q

  quality:
    name: Static and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Ruff correctness checks
        run: ruff check .
      - name: Formatting verification
        run: ruff format --check app.py core/startup.py scripts/secret_scan.py tests/test_startup_policy.py tests/test_secret_scan.py
      - name: Bandit high-severity, high-confidence findings
        run: bandit -q -r core demo_execution shadow_runtime trading_v2 strategy -lll -iii
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - name: Tracked-file secret scan
        run: python scripts/secret_scan.py
