name: Feature request
description: Propose a scoped engineering or research improvement
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What user, maintainer, safety, or research problem needs solving?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed outcome
      description: Describe observable behavior, not only an implementation.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Area
      options: [Execution safety, Risk management, Strategy/research, Data, Telegram/web, Testing/CI, Documentation, Other]
    validations:
      required: true
  - type: textarea
    attributes:
      label: Safety and compatibility impact
      description: Cover live/Demo authority, state migration, API compatibility, bias, and rollback as applicable.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
  - type: checkboxes
    attributes:
      label: Research claims
      options:
        - label: I will not present unverified profitability or performance claims as fact.
          required: true
